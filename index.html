<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chata Pecka | Luxusní Útočiště v Srdci Přírody</title>
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Google Fonts: Playfair Display pro luxusní nadpisy + Plus Jakarta Sans pro text -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b1320;
      --card-bg: rgba(255, 255, 255, 0.96);
      --glass-bg: rgba(15, 23, 42, 0.65);
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --accent-gold: #d97706;
      --accent-light: #f0fdf4;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #e2e8f0;
      --radius-lg: 24px;
      --radius-md: 16px;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(13, 148, 136, 0.15), transparent 70%),
        linear-gradient(rgba(11, 19, 32, 0.85), rgba(11, 19, 32, 0.95)), 
        url('IMG_5687.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.7;
      padding-bottom: 60px;
    }

    /* Hero Sekce */
    .hero {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 100px 20px;
      color: #fff;
    }

    .badge-tag {
      background: rgba(13, 148, 136, 0.25);
      border: 1px solid rgba(45, 212, 191, 0.4);
      color: #2dd4bf;
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
      backdrop-filter: blur(8px);
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 6vw, 4.8rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .hero p {
      font-size: clamp(1.1rem, 2vw, 1.35rem);
      font-weight: 300;
      max-width: 680px;
      color: #cbd5e1;
      margin-bottom: 35px;
    }

    .hero-btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      text-decoration: none;
      padding: 18px 36px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1.05rem;
      box-shadow: 0 10px 25px rgba(13, 148, 136, 0.4);
      transition: all 0.3s ease;
    }
    .hero-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(13, 148, 136, 0.6);
    }

    /* Hlavní Kontejner */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: clamp(30px, 5vw, 60px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      margin-bottom: 50px;
      backdrop-filter: blur(10px);
    }

    /* Nadpisy sekcí */
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--text-main);
      margin-bottom: 12px;
      font-weight: 700;
    }
    .section-desc {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 40px;
    }

    /* Vybavení */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }
    .feature-card {
      background: #f8fafc;
      padding: 24px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
    }
    .feature-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }
    .feature-icon { font-size: 2rem; margin-bottom: 12px; }
    .feature-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 6px; color: var(--text-main); }
    .feature-text { font-size: 0.95rem; color: var(--text-muted); }

    /* Ceník */
    .price-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 50px;
    }
    .price-card {
      background: #fff;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 35px 25px;
      text-align: center;
      position: relative;
      transition: all 0.3s ease;
    }
    .price-card.featured {
      border-color: var(--primary);
      background: linear-gradient(180deg, #f0fdf4 0%, #fff 100%);
      box-shadow: 0 10px 30px rgba(13, 148, 136, 0.15);
    }
    .price-card.featured .badge {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: #fff;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .price-amount { font-size: 2.8rem; font-weight: 700; color: var(--primary-dark); margin: 15px 0; }
    .price-features { list-style: none; text-align: left; color: var(--text-muted); font-size: 0.95rem; }
    .price-features li { margin-bottom: 10px; padding-left: 24px; position: relative; }
    .price-features li::before { content: "✓"; position: absolute; left: 0; color: var(--primary); font-weight: bold; }

    /* Interaktivní Kalendář */
    .calendar-container {
      background: #f8fafc;
      border-radius: var(--radius-md);
      padding: 30px;
      border: 1px solid var(--border-color);
      margin-bottom: 50px;
    }
    .calendar-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .calendar-btn {
      background: #fff;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .calendar-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    .calendar-month-title { font-size: 1.3rem; font-weight: 700; color: var(--text-main); }
    
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      text-align: center;
    }
    .cal-head { font-weight: 700; font-size: 0.85rem; color: var(--text-muted); padding-bottom: 10px; }
    .cal-day {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 0;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .cal-day.empty { background: transparent; border: none; cursor: default; }
    .cal-day.available:hover {
      background: var(--primary);
      color: #fff;
      transform: scale(1.05);
      border-color: var(--primary);
    }
    .cal-day.booked {
      background: #fee2e2;
      color: #991b1b;
      border-color: #fecaca;
      text-decoration: line-through;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .cal-day.selected {
      background: var(--accent-gold) !important;
      color: #fff !important;
      border-color: var(--accent-gold) !important;
    }

    .cal-legend {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .legend-box { width: 14px; height: 14px; border-radius: 4px; display: inline-block; margin-right: 6px; }
