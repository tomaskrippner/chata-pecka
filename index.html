  <style>
    :root {
      /* Teplá severská barevná paleta */
      --bg-cream: #FAF7F2;          /* Hřejivá krémová/slonová kost */
      --card-white: #FFFFFF;        /* Čistá bílá */
      --forest-dark: #1A3026;       /* Hluboká lesní zeleň */
      --pine-green: #0F766E;        /* Smrková šalvějová */
      --pine-hover: #134E4A;
      --wood-gold: #C29B38;         /* Teplé dřevo / jemný akcent */
      --text-main: #1C2421;         /* Měkká černá pro skvělou čitelnost */
      --text-muted: #5E6963;        /* Elegantní zemitá šedozelená */
      --border-warm: #EAE4D9;       /* Jemný krémový rámeček */

      --radius-xl: 24px;

      --shadow-soft: 0 10px 30px -5px rgba(26, 48, 38, 0.05);
      --shadow-lift: 0 20px 35px -8px rgba(26, 48, 38, 0.12);

    html { scroll-behavior: smooth; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Hlavička & Navigace */
    header {
      background: rgba(250, 247, 242, 0.94);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-warm);
      padding: 16px 24px;
    }
    .nav-container {
      max-width: 1160px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--forest-dark);
    }
    .brand-icon {
      width: 42px;
      height: 42px;
      background: var(--forest-dark);
      color: #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(26, 48, 38, 0.2);
    }
    .brand-text {
      display: flex;
      flex-direction: column;
    }
    .brand-title {

      font-weight: 800;

      color: var(--wood-gold);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.92rem;
      transition: color 0.2s ease;
    }
    .nav-links a:hover { color: var(--pine-green); }

    .hero-container {
      max-width: 1160px;
      margin: 24px auto 0 auto;
      padding: 0 20px;
    }
    .hero-banner {
      background: linear-gradient(rgba(26, 48, 38, 0.35), rgba(26, 48, 38, 0.65)), url('IMG_5687.jpeg') center/cover no-repeat;
      height: 500px;
      border-radius: var(--radius-xl);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #ffffff;
      padding: 40px 24px;
      box-shadow: var(--shadow-lift);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .hero-banner h1 {
      font-size: clamp(2.3rem, 5vw, 3.8rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
      text-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .hero-banner p {
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      font-weight: 400;
      max-width: 660px;
      opacity: 0.95;
    }

    /* Rychlá rezervační lišta */
    .booking-bar {

      border-radius: var(--radius-lg);
      padding: 22px 30px;
      margin: -50px auto 44px auto;
      max-width: 1000px;
      box-shadow: var(--shadow-lift);
      border: 1px solid var(--border-warm);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) auto;
      gap: 18px;
      align-items: center;
      position: relative;
      z-index: 10;
    }
    .bar-field { display: flex; flex-direction: column; }
    .bar-field label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .bar-field input, .bar-field select {
      border: 1px solid var(--border-warm);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-main);
      background: #FAF9F6;
    }
    .btn-primary {
      background: var(--forest-dark);
      color: #ffffff;
      border: none;
      padding: 14px 30px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(26, 48, 38, 0.25);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary:hover {
      background: var(--pine-green);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(15, 118, 110, 0.35);
    }

    /* Kontejner */
    .main-container {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 20px 80px 20px;
    }

    .section-head { text-align: center; margin-bottom: 38px; }
    .section-tag {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--wood-gold);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      display: block;
    }
    .section-head h2 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--forest-dark);
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    .section-head p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 620px;
      margin: 0 auto;
    }

    .section-card {
      background: var(--card-white);
      border-radius: var(--radius-xl);
      padding: 44px;
      border: 1px solid var(--border-warm);
      box-shadow: var(--shadow-soft);
      margin-bottom: 40px;
    }

    /* Grid vybavení */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

      background: #FAF9F6;
      padding: 26px 20px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-warm);
      transition: all 0.25s ease;
    }
    .feature-item:hover {
      transform: translateY(-4px);
      border-color: var(--pine-green);
      box-shadow: var(--shadow-soft);
    }
    .feature-icon { font-size: 2rem; margin-bottom: 12px; display: block; }
    .feature-title { font-weight: 700; font-size: 1.05rem; color: var(--forest-dark); margin-bottom: 4px; }
    .feature-desc { font-size: 0.9rem; color: var(--text-muted); }
